<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakhi Gift - Nexply Studios</title>
  <meta name="description" content="Nexply Studios has a free Rakhi gift for your business - claim yours." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main
    style="
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
    "
  >
    <img src="nexply-logo-footer.svg" alt="Nexply Studios" class="hero-logo" />

    <span
      style="
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--lavender-1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        padding: 8px 18px;
        margin-bottom: 28px;
      "
    >
      Happy Raksha Bandhan
    </span>

    <h1
      id="gift-heading"
      style="
        font-size: clamp(28px, 5vw, 52px);
        line-height: 1.25;
        font-weight: 600;
        max-width: 780px;
        color: #ffffff;
      "
    >
      <!-- filled by script -->
    </h1>

    <p style="margin-top: 20px; max-width: 560px; color: var(--lavender-1); font-size: clamp(15px, 1.3vw, 18px)">
      A small thank-you from us to you, this Rakhi season - no strings attached, just claim it below.
    </p>

    <div class="cta-border-wrap" style="margin-top: 40px">
      <a id="claim-link" href="claim.html" class="cta-button">
        <span class="cta-fill"></span>
        <span class="cta-label">Claim Your Gift</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="position: relative; z-index: 1">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </main>

  <p class="footer-note">Nexply Studios &middot; One gift per business, please.</p>

  <script>
    var GIFTS = [
      'Free audit of your website',
      'Free GMB profile audit',
      'Free Social media audit',
      'Free SEO audit',
      'Free 30-minute brand growth strategy session',
      'Free 30-minute session on client acquisition strategies',
    ];

    var chosen = GIFTS[Math.floor(Math.random() * GIFTS.length)];

    document.getElementById('gift-heading').innerHTML =
      'This Rakhi, our gift to your business - <span class="gradient-text">&ldquo;' +
      chosen +
      '&rdquo;</span>';

    // Carry the chosen gift over to the claim form so it can be shown
    // there by default, without the person having to re-pick it.
    document.getElementById('claim-link').href = 'claim.html?gift=' + encodeURIComponent(chosen);
  </script>
</body>
</html>
