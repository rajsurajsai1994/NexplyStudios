<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Your Gift - Nexply Studios</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="style.css" />

  <style>
    .form-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: clamp(28px, 4vw, 40px);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
      text-align: left;
    }

    .field label {
      font-size: 13px;
      font-weight: 500;
      color: var(--lavender-2);
    }

    .field input {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field input:focus {
      border-color: rgba(124, 108, 255, 0.6);
    }

    .field input[readonly] {
      color: var(--lavender-1);
      background: rgba(255, 255, 255, 0.03);
      cursor: default;
    }

    .submit-btn {
      width: 100%;
      justify-content: center;
      margin-top: 6px;
    }

    #form-error {
      display: none;
      color: #ff8a8a;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" style="display: inline-flex">
      <img src="nexply-logo-footer.svg" alt="Nexply Studios" />
    </a>
  </header>

  <main
    style="
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    "
  >
    <!-- Form state -->
    <div id="form-view" class="form-card">
      <h1 style="font-size: clamp(22px, 3vw, 28px); font-weight: 600; margin-bottom: 8px">
        Claim your <span class="gradient-text">gift</span>
      </h1>
      <p style="color: var(--lavender-1); font-size: 14px; margin-bottom: 28px">
        A few details and we'll be in touch to set it up.
      </p>

     <form id="claim-form" action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="0ce283f5-4bcd-4210-a363-91f2680a411b">
  <input type="hidden" name="subject" value="New Rakhi Gift Claim — Nexply Studio">
  <input type="hidden" name="from_name" value="Nexply Studio Rakhi Campaign">
  <input type="hidden" name="redirect" value="https://web3forms.com/success">
  <input type="checkbox" name="botcheck" style="display: none;">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required autocomplete="tel" />
        </div>

        <div class="field">
          <label for="business">Business Name</label>
          <input type="text" id="business" name="business" required autocomplete="organization" />
        </div>

        <div class="field">
          <label for="gift">Your Gift</label>
          <input type="text" id="gift" name="gift" readonly />
        </div>

        <div class="cta-border-wrap" style="display: block; width: 100%; margin-top: 8px">
          <button type="submit" id="submit-btn" class="cta-button submit-btn">
            <span class="cta-fill"></span>
            <span class="cta-label" id="submit-label">Submit</span>
          </button>
        </div>

        <p id="form-error">Something went wrong sending that - please try again in a moment.</p>
      </form>
    </div>

    <!-- Success state -->
    <div id="success-view" class="form-card" style="display: none; text-align: center">
      <div
        style="
          width: 56px;
          height: 56px;
          border-radius: 9999px;
          background: var(--gradient-a);
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 20px;
        "
      >
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 style="font-size: clamp(20px, 3vw, 26px); font-weight: 600; margin-bottom: 10px">You're all set!</h1>
      <p style="color: var(--lavender-1); font-size: 14px">
        Thanks - we've got your details and will call you within 24 hours to set up your gift.
      </p>
    </div>
  </main>

  <p class="footer-note">Nexply Studios &middot; One gift per business, please.</p>

  <script>
    // Pre-fill the gift field from the query string the landing page set.
    var params = new URLSearchParams(window.location.search);
    var gift = params.get('gift') || 'Free audit of your website';
    document.getElementById('gift').value = gift;

    // ---------------------------------------------------------------
    // IMPORTANT - before this goes live, replace YOUR_FORM_ID below with
    // your real Formspree form ID (see the setup note that came with
    // this file). Until then, submissions will not be delivered anywhere.
    // ---------------------------------------------------------------
    var FORMSPREE_ENDPOINT = 'https://api.web3forms.com/submit';

    var form = document.getElementById('claim-form');
    var submitBtn = document.getElementById('submit-btn');
    var submitLabel = document.getElementById('submit-label');
    var errorEl = document.getElementById('form-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitLabel.textContent = 'Sending...';

      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: new FormData(form),
      })
        .then(function (response) {
          if (response.ok) {
            document.getElementById('form-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'block';
          } else {
            throw new Error('Submission failed');
          }
        })
        .catch(function () {
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitLabel.textContent = 'Submit';
        });
    });
  </script>
</body>
</html>
